<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#07150b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030703" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#04200e" />
    </linearGradient>

    <linearGradient id="maleHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152618" />
      <stop offset="100%" stop-color="#060d07" />
    </linearGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#00ff66" stroke-width="1">
    <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800 M0,500 H800" />
    <path d="M100,0 V600 M200,0 V600 M300,0 V600 M400,0 V600 M500,0 V600 M600,0 V600 M700,0 V600" />
  </g>

  <!-- Workspace Desk & Setup -->
  <rect x="50" y="480" width="700" height="120" rx="10" fill="#080f0a" stroke="rgba(0,255,102,0.2)" stroke-width="2" />
  
  <!-- Editing Tablet Stand & Monitor -->
  <rect x="220" y="140" width="460" height="310" rx="16" fill="#0c180f" stroke="#00ff66" stroke-width="3" filter="url(#glow)" />
  <rect x="235" y="155" width="430" height="280" rx="8" fill="#030804" />

  <!-- Screen Content: Photo Editing Canvas -->
  <rect x="250" y="170" width="280" height="250" rx="6" fill="#061208" stroke="rgba(0,255,102,0.4)" stroke-width="1.5" />
  
  <!-- Edit Artwork Silhouette inside tablet canvas -->
  <path d="M260,390 Q320,290 370,330 T480,260 T520,390 Z" fill="url(#screenGlow)" opacity="0.6" />
  <circle cx="450" cy="230" r="30" fill="#00ff66" opacity="0.8" filter="url(#subtleGlow)" />
  
  <!-- Image Editing UI Overlay Elements -->
  <g stroke="#00ff66" stroke-width="1.5" opacity="0.85">
    <!-- UI Panels on Right of Tablet -->
    <rect x="545" y="170" width="105" height="70" rx="4" fill="rgba(0,255,102,0.06)" />
    <line x1="555" y1="185" x2="635" y2="185" />
    <circle cx="585" cy="185" r="4" fill="#00ff66" />
    <line x1="555" y1="205" x2="635" y2="205" />
    <circle cx="615" cy="205" r="4" fill="#00ff66" />
    <line x1="555" y1="225" x2="635" y2="225" />
    <circle cx="570" cy="225" r="4" fill="#00ff66" />

    <!-- Color Wheel UI -->
    <circle cx="597" cy="295" r="28" fill="none" stroke="#00ff66" stroke-width="2" />
    <circle cx="610" cy="285" r="4" fill="#84cc16" />

    <!-- Layers List -->
    <rect x="545" y="340" width="105" height="80" rx="4" fill="rgba(0,255,102,0.06)" />
    <rect x="552" y="350" width="91" height="18" rx="2" fill="rgba(0,255,102,0.2)" />
    <rect x="552" y="374" width="91" height="18" rx="2" fill="rgba(0,255,102,0.1)" />
    <rect x="552" y="398" width="91" height="18" rx="2" fill="rgba(0,255,102,0.1)" />
  </g>

  <!-- Male Digital Artist / Boy Character Silhouette Pose -->
  <g id="maleArtist">
    <!-- Body & Hoodie Profile -->
    <path d="M60,600 C80,470 140,360 230,340 C270,330 300,360 280,430 L270,600 Z" fill="url(#maleHoodie)" stroke="rgba(0,255,102,0.4)" stroke-width="2" />
    
    <!-- Male Head Profile with Short Hair & Headphones -->
    <!-- Neck -->
    <path d="M190,340 C195,310 205,300 215,290 L230,340 Z" fill="#1b2e1f" />
    
    <!-- Face / Jaw Profile (Male) -->
    <path d="M210,295 C230,295 245,280 248,260 C250,245 242,230 230,225 C205,220 185,240 185,265 C185,285 195,295 210,295 Z" fill="#1e3423" stroke="#00ff66" stroke-width="1.5" />
    
    <!-- Male Short Hair Cut Contour -->
    <path d="M180,255 C185,220 210,210 235,220 C245,225 240,240 235,245 C225,235 200,235 190,255 Z" fill="#070f08" stroke="#00ff66" stroke-width="1" />
    
    <!-- Headphones over Ear -->
    <rect x="200" y="240" width="22" height="32" rx="8" fill="#00ff66" filter="url(#subtleGlow)" opacity="0.9" />
    <path d="M195,240 C195,215 225,215 225,240" fill="none" stroke="#00ff66" stroke-width="3" />

    <!-- Arm Extended Holding Stylus Pen -->
    <path d="M230,380 C270,370 330,360 380,330 C395,320 380,310 350,335 C310,360 260,370 230,410 Z" fill="#1b2e1f" stroke="#00ff66" stroke-width="1.5" />
    
    <!-- Hand holding Pen -->
    <circle cx="382" cy="326" r="10" fill="#243d29" />
    <!-- Stylus Pen -->
    <line x1="370" y1="340" x2="410" y2="305" stroke="#00ff66" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <!-- Glowing Pen Tip Touch Point on Tablet -->
    <circle cx="410" cy="305" r="5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Glowing Energy Rays & Light Emission from Tablet -->
  <polygon points="235,155 665,155 450,450 180,450" fill="url(#screenGlow)" opacity="0.08" />

  <!-- SketchFest Doomsday Badge Header on SVG -->
  <rect x="260" y="40" width="280" height="42" rx="21" fill="rgba(3,8,4,0.85)" stroke="#00ff66" stroke-width="1.5" filter="url(#glow)" />
  <text x="400" y="66" fill="url(#neonText)" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="1">SKETCHFEST CREATOR</text>
</svg>
