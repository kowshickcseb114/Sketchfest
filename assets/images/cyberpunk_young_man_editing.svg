<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cyberBg" cx="45%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#071d0e" />
      <stop offset="45%" stop-color="#040c06" />
      <stop offset="100%" stop-color="#010402" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <linearGradient id="holoScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 102, 0.4)" />
      <stop offset="50%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(2, 20, 8, 0.9)" />
    </linearGradient>

    <linearGradient id="manProfile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193320" />
      <stop offset="100%" stop-color="#070f08" />
    </linearGradient>

    <linearGradient id="jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112415" />
      <stop offset="100%" stop-color="#050a05" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Black & Green Ambient Background -->
  <rect width="960" height="640" fill="url(#cyberBg)" />

  <!-- Holographic Matrix Grid Lines -->
  <g opacity="0.08" stroke="#00ff66" stroke-width="1.2">
    <path d="M0,80 H960 M0,160 H960 M0,240 H960 M0,320 H960 M0,400 H960 M0,480 H960 M0,560 H960" />
    <path d="M120,0 V640 M240,0 V640 M360,0 V640 M480,0 V640 M600,0 V640 M720,0 V640 M840,0 V640" />
  </g>

  <!-- Hexagonal Tech Background Nodes -->
  <g fill="none" stroke="#00ff66" stroke-width="1" opacity="0.15">
    <polygon points="100,100 130,80 160,100 160,130 130,150 100,130" />
    <polygon points="800,120 830,100 860,120 860,150 830,170 800,150" />
    <polygon points="820,400 850,380 880,400 880,430 850,450 820,430" />
  </g>

  <!-- Futuristic Workstation Desk -->
  <polygon points="0,520 960,520 960,640 0,640" fill="#040a05" />
  <line x1="0" y1="520" x2="960" y2="520" stroke="#00ff66" stroke-width="2.5" opacity="0.4" filter="url(#hyperGlow)" />

  <!-- Dual Floating Holographic Monitor Display Screens -->
  <!-- Screen 1: Primary Curved Editing Screen -->
  <rect x="300" y="110" width="520" height="340" rx="16" fill="url(#holoScreen)" stroke="#00ff66" stroke-width="2.5" filter="url(#hyperGlow)" />
  
  <!-- Screen Inner Canvas -->
  <rect x="315" y="125" width="490" height="310" rx="10" fill="#020804" />
  
  <!-- Editing Software HUD Top Header -->
  <rect x="315" y="125" width="490" height="32" fill="#07180c" />
  <circle cx="335" cy="141" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="350" cy="141" r="5" fill="#facc15" opacity="0.8" />
  <circle cx="365" cy="141" r="5" fill="#00ff66" opacity="0.8" />

  <!-- Photo Editing Artwork Canvas Area -->
  <rect x="370" y="170" width="300" height="210" fill="#041207" stroke="rgba(0,255,102,0.4)" stroke-width="1.5" />
  
  <!-- Editing Artwork Preview (Cybernetic Mountain & Green Planet Sun) -->
  <path d="M380,360 L450,260 L510,310 L590,230 L665,360 Z" fill="url(#neonGreen)" opacity="0.75" />
  <circle cx="610" cy="220" r="28" fill="#00ff66" filter="url(#hyperGlow)" />
  
  <!-- Active Selection & Vector Anchor Handles -->
  <rect x="400" y="190" width="240" height="160" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="5,4" />
  <circle cx="400" cy="190" r="4" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="640" cy="190" r="4" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="400" cy="350" r="4" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="640" cy="350" r="4" fill="#ffffff" filter="url(#softGlow)" />

  <!-- Floating HUD Sliders & Color Wheel (Right Side Panel) -->
  <rect x="680" y="170" width="115" height="250" fill="#051409" stroke="rgba(0,255,102,0.3)" stroke-width="1" />
  <!-- Color Wheel -->
  <circle cx="737" cy="215" r="26" fill="none" stroke="#00ff66" stroke-width="3" />
  <circle cx="748" cy="204" r="5" fill="#84cc16" filter="url(#hyperGlow)" />
  <!-- Sliders -->
  <rect x="690" y="260" width="95" height="6" rx="3" fill="#0c2412" />
  <circle cx="730" cy="263" r="6" fill="#00ff66" filter="url(#hyperGlow)" />
  <rect x="690" y="280" width="95" height="6" rx="3" fill="#0c2412" />
  <circle cx="755" cy="283" r="6" fill="#00ff66" filter="url(#hyperGlow)" />
  <!-- Layers List -->
  <rect x="690" y="305" width="95" height="24" rx="4" fill="rgba(0,255,102,0.25)" stroke="#00ff66" stroke-width="1" />
  <rect x="690" y="335" width="95" height="24" rx="4" fill="rgba(0,255,102,0.08)" />
  <rect x="690" y="365" width="95" height="24" rx="4" fill="rgba(0,255,102,0.08)" />

  <!-- Screen 2: Secondary Side Monitor Floating Left -->
  <rect x="180" y="180" width="105" height="250" rx="10" fill="url(#holoScreen)" stroke="#00ff66" stroke-width="1.5" transform="rotate(8, 232, 305)" opacity="0.85" />
  <path d="M195,210 H270 M195,240 H270 M195,270 H270 M195,300 H270 M195,330 H270 M195,360 H270" stroke="#00ff66" stroke-width="2" opacity="0.4" stroke-dasharray="8,4" transform="rotate(8, 232, 305)" />

  <!-- High-Tech Graphics Tablet & Keyboard on Desk -->
  <rect x="250" y="500" width="150" height="95" rx="8" fill="#091a0c" stroke="#00ff66" stroke-width="2" transform="rotate(-6, 325, 547)" filter="url(#softGlow)" />
  <rect x="262" y="512" width="126" height="71" rx="4" fill="#020603" transform="rotate(-6, 325, 547)" />
  <circle cx="272" cy="524" r="4" fill="#00ff66" filter="url(#hyperGlow)" />

  <!-- CYBERPUNK YOUNG MAN CREATOR SILHOUETTE (Editing Pose) -->
  <g id="cyberYoungMan">
    <!-- Body & Cyber Jacket (Seated Facing Screen) -->
    <path d="M30,640 C40,510 80,390 170,360 C210,350 260,380 240,470 C230,510 220,590 210,640 Z" fill="url(#jacket)" stroke="#00ff66" stroke-width="2" />
    <!-- Collar & LED Trim on Jacket -->
    <path d="M140,400 Q170,370 200,400" stroke="#00ff66" stroke-width="3" fill="none" filter="url(#hyperGlow)" />
    
    <!-- Young Man Neck Profile -->
    <path d="M165,365 C175,330 190,315 200,305 L215,360 Z" fill="url(#manProfile)" />

    <!-- Sharp Masculine Head & Jawline Profile -->
    <path d="M185,305 C210,305 230,290 235,265 C240,240 232,215 215,210 C185,205 165,230 165,260 C165,285 175,305 185,305 Z" fill="url(#manProfile)" stroke="#00ff66" stroke-width="1.5" />

    <!-- Modern Cyberpunk Short Haircut Fade -->
    <path d="M160,250 C162,205 190,190 220,200 C235,205 232,225 225,230 C212,215 185,215 172,245 Z" fill="#030804" stroke="#00ff66" stroke-width="1.2" />
    
    <!-- Cyberpunk VR/AR Smart Glasses / Visor over Eyes -->
    <polygon points="200,230 242,230 238,245 198,245" fill="#00ff66" filter="url(#hyperGlow)" opacity="0.95" />

    <!-- Headphones around Neck/Ear -->
    <rect x="180" y="230" width="22" height="34" rx="8" fill="#10b981" stroke="#00ff66" stroke-width="1.5" filter="url(#softGlow)" opacity="0.9" />

    <!-- Left Arm Resting on Desk -->
    <path d="M150,420 C190,430 270,460 350,495 C360,500 350,510 330,510 C260,480 190,450 140,455 Z" fill="url(#jacket)" stroke="rgba(0,255,102,0.4)" stroke-width="1.5" />

    <!-- Right Arm Extended Holding Glowing Stylus Pen -->
    <path d="M170,410 C220,400 260,420 295,485 C300,495 290,505 275,500 C245,450 210,430 160,430 Z" fill="url(#jacket)" stroke="#00ff66" stroke-width="2" />
    
    <!-- Right Hand holding Stylus Pen over Tablet -->
    <circle cx="290" cy="492" r="11" fill="url(#manProfile)" stroke="#00ff66" stroke-width="1" />
    
    <!-- Stylus Pen Touch Point -->
    <line x1="270" y1="505" x2="310" y2="475" stroke="#00ff66" stroke-width="4.5" stroke-linecap="round" filter="url(#hyperGlow)" />
    <circle cx="310" cy="475" r="7" fill="#ffffff" filter="url(#hyperGlow)" />
  </g>

  <!-- Ambient Light Reflection from Screen onto Young Man -->
  <polygon points="300,125 820,125 900,520 120,520" fill="url(#neonGreen)" opacity="0.06" />
</svg>
